name: Backend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'server-api/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'server-api/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build-and-test:
    name: Build & Test (.NET 9)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore server-api/ServerApi.csproj

      - name: Build project (Release)
        run: dotnet build server-api/ServerApi.csproj -c Release --no-restore /p:TreatWarningsAsErrors=false

      - name: Run unit & integration tests
        run: dotnet test server-api/ServerApi.csproj -c Release --no-build --verbosity normal
        continue-on-error: true

