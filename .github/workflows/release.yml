name: Automated Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      # 1. Build Frontend
      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'dr-ahmed/package-lock.json'

      - name: Build Frontend Application
        run: |
          cd dr-ahmed
          npm ci
          npm run build
        env:
          NODE_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://jqckzibvkggwfvsdzawa.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_QOjIqSJvhptTcEKprbizPQ_VkWjya8B' }}

      - name: Archive Frontend Artifacts
        run: |
          cd dr-ahmed
          tar -czvf ../frontend-${{ steps.get_version.outputs.version }}.tar.gz .output

      # 2. Build Backend
      - name: Setup .NET 9.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish Backend Web API
        run: |
          dotnet publish server-api/ServerApi.csproj -c Release -o ./publish-backend /p:UseAppHost=false
          cd publish-backend
          zip -r ../backend-${{ steps.get_version.outputs.version }}.zip .

      # 3. Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            frontend-${{ steps.get_version.outputs.version }}.tar.gz
            backend-${{ steps.get_version.outputs.version }}.zip

